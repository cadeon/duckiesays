version: '3.8'

services:
  duckiesays:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3999:3000"
    environment:
      - NODE_ENV=production
      - LLM_API_URL=http://172.30.250.65:8000/v1/chat/completions
      - LLM_MODEL=qwen
    restart: unless-stopped
    volumes:
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v2/thinks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
