<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ask the rubber duck for wisdom.">
    <title>Duckie Says</title>

    <link rel="icon" href="img/duckieblue.png" type="image/png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #6495ED;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: Georgia, "Times New Roman", Times, serif;
    padding-bottom: env(safe-area-inset-bottom, 0px);
}

.duckie {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 10px;
}

.duckie img {
    width: 150px;
    height: 150px;
    transition: transform 0.2s ease;
}

.duckie img:hover {
    transform: scale(1.05);
}

.container {
    flex: 1;
    display: flex;
    flex-direction: column;
}

#prompt {
    background-color: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    font-size: 24px;
    font-weight: bold;
    color: #323131;
    text-align: center;
    outline: none;
    width: 90%;
    margin: 0 auto 8px;
    padding: 16px;
    font-family: Georgia, "Times New Roman", Times, serif;
    resize: none;
    min-height: 60px;
    line-height: 1.4;
    transition: border-color 0.2s ease, background-color 0.2s ease;
}

#prompt:focus {
    background-color: rgba(255, 255, 255, 0.25);
    border-color: rgba(255, 255, 255, 0.6);
}

#prompt.dragover {
    border-color: rgba(255, 255, 255, 0.9);
    background-color: rgba(255, 255, 255, 0.35);
}

#prompt::placeholder {
    color: #323131;
    opacity: 0.5;
}

.container hr {
    border: none;
    border-top: 2px solid rgba(255, 255, 255, 0.25);
    margin: 0;
}

#response {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    color: whitesmoke;
    font-size: 28px;
    text-align: center;
    font-family: Georgia, "Times New Roman", Times, serif;
    line-height: 1.4;
    min-height: 120px;
    word-wrap: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
    width: 90%;
    margin: 0 auto;
}

/* Hidden file input */
#imageInput {
    display: none;
}

/* Image preview row */
.image-preview {
    width: 90%;
    margin: 0 auto 8px;
    display: none;
    position: relative;
}

.image-preview.visible {
    display: block;
}

.image-preview img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
    border: 2px solid rgba(255, 255, 255, 0.3);
}

#imageRemove {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: none;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
}

#imageRemove:hover {
    background: rgba(0, 0, 0, 0.8);
}

.byline {
    border-top: 2px solid rgba(255,255,255,0.2);
    display: flex;
    justify-content: space-between;
    color: whitesmoke;
    font-size: 14px;
    font-family: Arial, Helvetica, sans-serif;
    padding: 12px 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
}

.byline a {
    color: whitesmoke;
    text-decoration: none;
}

.byline a:hover {
    font-weight: bold;
}

@media (min-width: 768px) {
    .duckie img {
        width: 200px;
        height: 200px;
    }
    #response {
        font-size: 32px;
    }
}
</style>
</head>

<body>
  <div class="duckie">
      <a href="#" id="ducklink">
          <img src="img/pitr-Ducky-icon.svg"
          alt="duckie"/>
      </a>
  </div>
  <div class="container">
    <textarea id="prompt" placeholder="Write to Duckie... Drop an image... Click the Duckie..."></textarea>
    <input type="file" id="imageInput" accept="image/*">
    <div class="image-preview" id="imagePreview">
      <img id="previewImg" src="" alt="Preview">
      <button id="imageRemove" title="Remove image">✕</button>
    </div>
    <hr>
    <div id="response"></div>
  </div>
  <div class="byline">
    <a href="https://medium.com/@chris_47577/duckie-says-write-down-your-experiences-8da5a07c41c3" target="_blank" rel="noopener">what the duck?</a>
    <a href="https://legacy.duckiesays.com" target="_blank" rel="noopener">legacy duck</a>
  </div>

<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript">
$(document).ready(function () {

    var currentImageData = null;

    // --- Permalink support ---
    function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(window.location.href);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    function createPermalinkData() {
        var prompt = $("#prompt").val();
        var response = $("#response").text();
        if (!prompt.trim()) return '';
        try {
            var json = JSON.stringify({ prompt: prompt, response: response });
            return btoa(encodeURIComponent(json))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
        } catch (e) {
            console.error('Error creating permalink:', e);
            return '';
        }
    }

    function parsePermalink() {
        var permalink = getUrlParameter('guru_meditation');
        if (!permalink) return false;
        try {
            var decoded = decodeURIComponent(atob(permalink
                .replace(/-/g, '+')
                .replace(/_/g, '/')));
            var data = JSON.parse(decoded);
            if (data.prompt) {
                $("#prompt").val(data.prompt);
                if (data.response) {
                    $("#response").text(data.response);
                }
                $("#prompt")[0].style.height = "auto";
                $("#prompt")[0].style.height = ($("#prompt")[0].scrollHeight) + "px";
                return true;
            }
        } catch (e) {
            console.error('Error parsing permalink:', e);
        }
        return false;
    }

    parsePermalink();

    // --- Image handling ---
    function handleImageFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            currentImageData = e.target.result;
            $("#previewImg").attr("src", currentImageData);
            $("#imagePreview").addClass("visible");
        };
        reader.readAsDataURL(file);
    }

    function clearImage() {
        currentImageData = null;
        $("#imagePreview").removeClass("visible");
        $("#previewImg").attr("src", "");
        $("#imageInput").val('');
    }

    $("#imageRemove").click(clearImage);

    // --- Drag and drop on textarea ---
    $("#prompt").on("dragover dragenter", function(e) {
        e.preventDefault();
        e.stopPropagation();
        $(this).addClass("dragover");
    });

    $("#prompt").on("dragleave drop", function(e) {
        e.preventDefault();
        e.stopPropagation();
        $(this).removeClass("dragover");
        if (e.type === 'drop' && e.originalEvent.dataTransfer.files.length) {
            var file = e.originalEvent.dataTransfer.files[0];
            handleImageFile(file);
        }
    });

    // Also allow clicking the textarea to trigger file picker when empty
    // (only if there's no text and no image yet)
    $("#prompt").on("click", function(e) {
        // Don't intercept — let normal text editing work.
        // Users drag-drop images onto the textarea.
    });

    // --- Submit ---
    function submitPrompt() {
        var prompt = $("#prompt").val();
        // Allow submission with just an image, no text required
        if (prompt.trim() === "" && !currentImageData) {
            return;
        }
        var root = window.location.protocol + "//" + window.location.host;
        var target = root + "/api/v2/thinks";
        $("#response").text(". . .");

        var payload = { prompt: prompt || "" };
        if (currentImageData) {
            payload.image = currentImageData;
        }

        $.ajax({
            type: "POST",
            url: target,
            data: JSON.stringify(payload),
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            success: function (data) {
                setTimeout(function () {
                    $("#response").text(data.says);
                    var encoded = createPermalinkData();
                    if (encoded) {
                        var newUrl = window.location.href.split('?')[0] + '?guru_meditation=' + encoded;
                        window.history.replaceState({}, '', newUrl);
                    }
                }, 1000);
            },
            error: function () {
                $("#response").text("The duck is pondering... or perhaps napping.");
            }
        });
    }

    $("#prompt").on("input", function () {
        this.style.height = "auto";
        this.style.height = (this.scrollHeight) + "px";
    });

    $("#prompt").keydown(function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            submitPrompt();
        }
    });

    $("#ducklink").click(function (e) {
        e.preventDefault();
        submitPrompt();
    });
});
</script>

</body>
</html>
