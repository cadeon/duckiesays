<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Duckie Says</title>

<style>
body {
    background-color: #6495ED;
    margin: 0;
}
div {
  display: flex;
  align-items: center;
  justify-content: center;
}

.duckie {
    border-bottom: 2px solid #EEE;
    background-color: #6495ED;
    height: 200px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
    transition: transform .2s;
}

.duckie a:hover {
    transform: scale(1.05);
}

.container {
    min-height: 10vh;
    border-bottom: 2px solid #EEE;
}
.box {
    display: flex;
    margin: 3vh;
    color: whiteSmoke;
    font-size: 32px;
    text-align: center;
    font-family: Georgia, "Times New Roman", Times, serif;
    height: auto;
}

.footer {
    right: 5px;
    left: 5px;
    bottom: 5px;
    background-color: whiteSmoke;
    height: 30px;
    margin-top: 30px;
    border-radius: 5px;
}
.footer a:any-link {
    color: #6495ED;
    font-weight: bold;
    font-family: Georgia, "Times New Roman", Times, serif;
}

a:hover {
    font-weight: bold;
}

.byline {
    display: block;
    margin: 3vh;
    color: whitesmoke;
    font-size: 14px;
    text-align: right;
    font-family: Arial, Helvetica, sans-serif;
    height: auto;
}
.byline :any-link {
    color: whitesmoke;
}
#left {
    float: left;
    text-align: left;
}
#right {
    float: right;
    text-align: right;
}
</style>
</head>

<body>
  <div class="duckie">
      <a href id="ducklink" border=0>
          <img src="img/pitr-Ducky-icon.svg"
          onerror="this.src='img/pitr-Ducky-icon-300px.png'"
          alt="duckie" height="200" width="200"/>
      </a>
  </div>
  <div class="container">
    <section>
        <span class="box" id="quote">. . .</span>
    </section>
  </div>

  <div class="footer">
        <a id="permalink" href="">. . .</a>
  </div>

  <div class="byline">
    <a id="left" href="https://medium.com/@chris_47577/duckie-says-write-down-your-experiences-8da5a07c41c3" target="_blank" rel="noopener">what the duck?</a>
    <a id="right" href="https://duckiesays.com" target="_blank" rel="noopener">duckie-thinks</a>
  </div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
$(document).ready(function () {
    var url = window.location.href;
    var id = url.match(/\/(\d+)$/);

    var root = window.location.protocol + "//" + window.location.host;
    var target = root + "/api/v2/says";
    if (id) {
        target += "/" + id[1];
    }
    $.getJSON(target, function(data) {
        $("#quote").text(data.says);
        var permalink = root + "/" + data.id;
        $("#permalink").attr("href", permalink);
        $("#permalink").text(permalink);
        $("#ducklink").attr("href", root);
        history.pushState(null, null, permalink);
    });
});
</script>

</body>
</html>
