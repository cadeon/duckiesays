<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <title>Duckie Says</title>

    <link rel="icon" href="img/duckieblue.png" type="image/png">

<style>
body {
    background-color: #6495ED
}
div {
  display: flex;
  align-items: center;
  justify-content: center;
}



.duckie {
    height: 200px;
    border-bottom: 2px solid #EEE;
    background-color: #6495ED;
    height: 200px;
    -webkit-border-top-left-radius: 10px;
    -webkit-border-top-right-radius: 10px;
    -moz-border-radius-topleft: 10px;
    -moz-border-radius-topright: 10px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
}


.duckie img:hover {
    transform: scale(1.05);
}

.container {
    min-height: 0;
}
.box {
    display: flex;
    margin: 3vh;
    color: whiteSmoke;
    font-size: 32px;
    text-align: center;
    font-family:Georgia, "Times New Roman", Times, serif;
    height:auto;
    width: 100%;
}

.footer {
    right:5px;
    left: 5px;
    bottom:5px;
    background-color: whiteSmoke;
    height: 30px;
    margin-top:30px;
    border-top-left-radius: 5px;
    border-top-right-radius: 5px;
    border-bottom-left-radius: 5px;
    border-bottom-right-radius: 5px;
}
.footer a:any-link{
    color: #6495ED;
    font-weight:bold;
    font-family:Georgia, "Times New Roman", Times, serif;
}

body {
  margin:0;
}

.byline {
    border-top: 2px solid #EEE;
    display: block;
    color: whitesmoke;
    font-size: 14px;
    font-family:Arial, Helvetica, sans-serif;
    height:auto;
}
.byline :any-link{
    color:whitesmoke
}
.byline a:hover {
    font-weight: bold;
}
#left {
    float:left;
    text-align:left;
    margin:3vh;
}
#right {
    float: right;
    text-align: right;
    margin:3vh;
}

#prompt {
    background-color: #6495ED; /* Blend with background */
    border: none; /* Remove default border */
    font-size: 24px; /* Larger font */
    font-weight: bold; /* Make text bolder */
    color: #323131; 
    text-align: center; /* Center text */
    outline: none; /* Remove outline on focus */
    width: 100%; /* Adjust width as needed */
    box-sizing: border-box; /* Include padding in width */
    min-height: auto;
    resize: vertical; /* Allow vertical resizing */
    overflow: auto; /* Handle content overflow */
    padding: 5px; /* Add some padding */
}

#prompt::placeholder {
    color: #323131; 
    opacity: 0.5; /* Adjust opacity as needed */
}

</style>
</head>

<body>
  <div class="duckie">
      <a href id="ducklink" border=0>
          <img src="img/pitr-Ducky-icon.svg"
          alt="duckie" height="200" width="200"/>
      </a>
  </div>
  <div class="container">
    <textarea id="prompt" name="prompt" placeholder="Write to Duckie... Click the Duckie..."></textarea>
  </div>
  <div class="container">
      <div class="box" id="response"></div>
  </div>
  <div class="byline">
    <a id=left href="https://medium.com/@chris_47577/duckie-says-write-down-your-experiences-8da5a07c41c3" target=_blank>what the duck?</a>
    <a id=right href="https://legacy.duckiesays.com" target=_blank>legacy duck</a>
  </div>

<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script type="text/javascript">
$( document ).ready(function () {
    // Get URL parameters
    function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(window.location.href);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }
    
    // Create permalink from current prompt and response
    function createPermalink() {
        var prompt = $("#prompt").val();
        var response = $("#response").text();
        
        if (!prompt.trim()) return '';
        
        // Create a simple base64 encoded object
        var data = {
            prompt: prompt,
            response: response
        };
        
        try {
            var json = JSON.stringify(data);
            // URL-safe base64 encoding
            var encoded = btoa(encodeURIComponent(json))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
            return encoded;
        } catch (e) {
            console.error('Error creating permalink:', e);
            return '';
        }
    }
    
    // Parse permalink and populate form
    function parsePermalink() {
        var permalink = getUrlParameter('p');
        if (!permalink) return false;
        
        try {
            // URL-safe base64 decoding
            var decoded = decodeURIComponent(atob(permalink
                .replace(/-/g, '+')
                .replace(/_/g, '/')));
            var data = JSON.parse(decoded);
            
            if (data.prompt) {
                $("#prompt").val(data.prompt);
                if (data.response) {
                    $("#response").text(data.response);
                }
                return true;
            }
        } catch (e) {
            console.error('Error parsing permalink:', e);
        }
        return false;
    }
    
    function submitPrompt() {
        var prompt = $("#prompt").val();
        if (prompt.trim() === "") {
            return;
        }
        var root = window.location.protocol + "//" + window.location.host;
        var target = root + "/api/v2/thinks";
        $("#response").text(". . ."); // thinking indicator
        $.ajax({
            type: "POST",
            url: target,
            data: JSON.stringify({ prompt: prompt }),
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            success: function(data){
                setTimeout(function() {
                    var responseElement = $("#response");
                    responseElement.text(data.says);
                    
                    // Update URL with permalink
                    var newUrl = window.location.href.split('?')[0] + '?p=' + createPermalink();
                    window.history.replaceState({}, '', newUrl);
                }, 1000); // 1 second thinking delay
            },
            error: function() {
                $("#response").text("The duck is pondering... or perhaps napping.");
            }
        });
    }

    // Check for permalink on page load
    parsePermalink();

    $("#prompt").on("input", function() {
        this.style.height = "auto";
        this.style.height = (this.scrollHeight) + "px";
    });

    $("#prompt").keydown(function(event) {
        if (event.which == 13 && !event.shiftKey) { // Enter key without Shift
            event.preventDefault();
            submitPrompt();
        }
    });

    $("#ducklink").click(function(e){
        e.preventDefault(); // prevent the link from navigating
        submitPrompt();
    });
})
</script>

</body>
</html>
