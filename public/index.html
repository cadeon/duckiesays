<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ask the rubber duck for wisdom.">
    <title>Duckie Says</title>

    <link rel="icon" href="img/duckieblue.png" type="image/png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #6495ED;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: Georgia, "Times New Roman", Times, serif;
    padding-bottom: env(safe-area-inset-bottom, 0px);
}

.duckie {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 10px;
}

.duckie img {
    width: 150px;
    height: 150px;
    transition: transform 0.2s ease;
}

.duckie img:hover {
    transform: scale(1.05);
}

.container {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Text input mode */
#prompt {
    background-color: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    font-size: 20px;
    font-weight: bold;
    color: #323131;
    text-align: center;
    outline: none;
    width: 90%;
    margin: 0 auto 8px;
    padding: 16px;
    font-family: Georgia, "Times New Roman", Times, serif;
    resize: none;
    min-height: 60px;
    line-height: 1.4;
    transition: border-color 0.2s ease, background-color 0.2s ease;
    overflow-wrap: break-word;
    word-wrap: break-word;
    hyphens: auto;
}

#prompt.hidden {
    display: none;
}

#prompt:focus {
    background-color: rgba(255, 255, 255, 0.25);
    border-color: rgba(255, 255, 255, 0.6);
}

#prompt::placeholder {
    color: #323131;
    opacity: 0.5;
}

/* Toggle link */
.toggle-link {
    width: 90%;
    margin: 0 auto 4px;
    text-align: right;
    font-size: 14px;
    font-family: Arial, Helvetica, sans-serif;
}

.toggle-link.hidden {
    display: none;
}

.toggle-link a {
    color: rgba(255, 255, 255, 0.6);
    text-decoration: none;
    cursor: pointer;
    transition: color 0.2s ease;
}

.toggle-link a:hover {
    color: rgba(255, 255, 255, 0.9);
}

/* Image mode — replaces the textarea */
.image-area {
    width: 90%;
    margin: 0 auto 8px;
    display: none;
    position: relative;
}

.image-area.visible {
    display: block;
}

/* Drop zone shown before image is picked */
#imageDropZone {
    background-color: rgba(255, 255, 255, 0.15);
    border: 2px dashed rgba(255, 255, 255, 0.4);
    border-radius: 8px;
    padding: 30px 16px;
    text-align: center;
    color: rgba(255, 255, 255, 0.6);
    font-size: 16px;
    font-family: Georgia, "Times New Roman", Times, serif;
    cursor: pointer;
    transition: border-color 0.2s ease, background-color 0.2s ease;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#imageDropZone:hover,
#imageDropZone.dragover {
    border-color: rgba(255, 255, 255, 0.8);
    background-color: rgba(255, 255, 255, 0.25);
}

#imageDropZone.hidden {
    display: none;
}

/* Image preview after selection */
#imagePreview {
    display: none;
    position: relative;
    text-align: center;
}

#imagePreview.visible {
    display: block;
}

#imagePreview img {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    max-height: 300px;
    border-radius: 8px;
    border: 2px solid rgba(255, 255, 255, 0.3);
}

#imageRemove {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: none;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
}

#imageRemove:hover {
    background: rgba(0, 0, 0, 0.8);
}

.container hr {
    border: none;
    border-top: 2px solid rgba(255, 255, 255, 0.25);
    margin: 0;
}

#response {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    color: whitesmoke;
    font-size: 28px;
    text-align: center;
    font-family: Georgia, "Times New Roman", Times, serif;
    line-height: 1.4;
    min-height: 120px;
    word-wrap: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
    width: 90%;
    margin: 0 auto;
}

/* Hidden file input */
#imageInput {
    display: none;
}

.byline {
    border-top: 2px solid rgba(255,255,255,0.2);
    display: flex;
    justify-content: space-between;
    color: whitesmoke;
    font-size: 14px;
    font-family: Arial, Helvetica, sans-serif;
    padding: 12px 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
}

.byline a {
    color: whitesmoke;
    text-decoration: none;
}

.byline a:hover {
    font-weight: bold;
}

@media (min-width: 768px) {
    .duckie img {
        width: 200px;
        height: 200px;
    }
    #prompt {
        font-size: 24px;
    }
    #response {
        font-size: 32px;
    }
}
</style>
</head>

<body>
  <div class="duckie">
      <a href="#" id="ducklink">
          <img src="img/pitr-Ducky-icon.svg"
          alt="duckie"/>
      </a>
  </div>
  <div class="container">
    <textarea id="prompt" placeholder="Write to Duckie..."></textarea>
    <div class="toggle-link" id="toggleLink"><a>or send an image</a></div>
    <div class="image-area" id="imageArea">
      <div id="imageDropZone">📷 tap to choose an image</div>
      <div id="imagePreview">
        <img id="previewImg" src="" alt="Preview">
        <button id="imageRemove" title="Remove image">✕</button>
      </div>
    </div>
    <input type="file" id="imageInput" accept="image/*">
    <hr>
    <div id="response"></div>
  </div>
  <div class="byline">
    <a href="https://medium.com/@chris_47577/duckie-says-write-down-your-experiences-8da5a07c41c3" target="_blank" rel="noopener">what the duck?</a>
    <a href="https://legacy.duckiesays.com" target="_blank" rel="noopener">legacy duck</a>
  </div>

<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript">
$(document).ready(function () {

    var currentImageData = null;
    var lastImageDescription = null;
    var imageMode = false;

    // --- Mode switching ---
    function enterImageMode() {
        imageMode = true;
        $("#prompt").addClass("hidden");
        $("#toggleLink").addClass("hidden");
        $("#imageArea").addClass("visible");
        $("#imageDropZone").removeClass("hidden");
    }

    function exitImageMode() {
        imageMode = false;
        currentImageData = null;
        lastImageDescription = null;
        $("#prompt").removeClass("hidden");
        $("#toggleLink").removeClass("hidden");
        $("#imageArea").removeClass("visible");
        $("#imagePreview").removeClass("visible");
        $("#previewImg").attr("src", "");
        $("#imageInput").val('');
    }

    // "or send an image" link
    $("#toggleLink a").click(function(e) {
        e.preventDefault();
        enterImageMode();
    });

    // --- Image handling ---
    function handleImageFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            currentImageData = e.target.result;
            $("#previewImg").attr("src", currentImageData);
            $("#imagePreview").addClass("visible");
            $("#imageDropZone").addClass("hidden");
        };
        reader.readAsDataURL(file);
    }

    // Click drop zone opens file picker
    $("#imageDropZone").click(function() {
        $("#imageInput").trigger("click");
    });

    // File selection
    $("#imageInput").on("change", function(e) {
        var file = e.target.files[0];
        if (file) handleImageFile(file);
    });

    // Drag and drop on the drop zone
    $("#imageDropZone").on("dragover dragenter", function(e) {
        e.preventDefault();
        e.stopPropagation();
        $(this).addClass("dragover");
    });

    $("#imageDropZone").on("dragleave drop", function(e) {
        e.preventDefault();
        e.stopPropagation();
        $(this).removeClass("dragover");
        if (e.type === 'drop' && e.originalEvent.dataTransfer.files.length) {
            handleImageFile(e.originalEvent.dataTransfer.files[0]);
        }
    });

    // Remove image — go back to text mode
    $("#imageRemove").click(function() {
        exitImageMode();
    });

    // --- Permalink support ---
    function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(window.location.href);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    function createPermalinkData() {
        var prompt = $("#prompt").val();
        var response = $("#response").text();
        // Image mode: use LLM description as the prompt
        var effectivePrompt = lastImageDescription
            ? "responded to image of " + lastImageDescription
            : prompt;
        if (!effectivePrompt.trim()) return '';
        try {
            var json = JSON.stringify({ prompt: effectivePrompt, response: response });
            return btoa(encodeURIComponent(json))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
        } catch (e) {
            console.error('Error creating permalink:', e);
            return '';
        }
    }

    function parsePermalink() {
        var permalink = getUrlParameter('guru_meditation');
        if (!permalink) return false;
        try {
            var decoded = decodeURIComponent(atob(permalink
                .replace(/-/g, '+')
                .replace(/_/g, '/')));
            var data = JSON.parse(decoded);
            if (data.prompt) {
                $("#prompt").val(data.prompt);
                if (data.response) {
                    $("#response").text(data.response);
                }
                $("#prompt")[0].style.height = "auto";
                $("#prompt")[0].style.height = ($("#prompt")[0].scrollHeight) + "px";
                return true;
            }
        } catch (e) {
            console.error('Error parsing permalink:', e);
        }
        return false;
    }

    parsePermalink();

    // --- Submit ---
    function submitPrompt() {
        var prompt = $("#prompt").val();
        // Text mode: need text. Image mode: need image.
        if (imageMode) {
            if (!currentImageData) return;
        } else {
            if (prompt.trim() === "") return;
        }

        var root = window.location.protocol + "//" + window.location.host;
        var target = root + "/api/v2/thinks";
        $("#response").text(". . .");

        var payload = {};
        if (imageMode) {
            payload.prompt = "";
            payload.image = currentImageData;
        } else {
            payload.prompt = prompt;
        }

        $.ajax({
            type: "POST",
            url: target,
            data: JSON.stringify(payload),
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            success: function (data) {
                setTimeout(function () {
                    $("#response").text(data.says);
                    // Capture image description for permalink
                    if (data.imageDescription) {
                        lastImageDescription = data.imageDescription;
                    }
                    var encoded = createPermalinkData();
                    if (encoded) {
                        var newUrl = window.location.href.split('?')[0] + '?guru_meditation=' + encoded;
                        window.history.replaceState({}, '', newUrl);
                    }
                    lastImageDescription = null;
                }, 1000);
            },
            error: function () {
                $("#response").text("The duck is pondering... or perhaps napping.");
            }
        });
    }

    $("#prompt").on("input", function () {
        this.style.height = "auto";
        this.style.height = (this.scrollHeight) + "px";
    });

    $("#prompt").keydown(function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            submitPrompt();
        }
    });

    $("#ducklink").click(function (e) {
        e.preventDefault();
        submitPrompt();
    });
});
</script>

</body>
</html>
