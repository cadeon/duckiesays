<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ask the rubber duck for wisdom.">
    <title>Duckie Says</title>

    <link rel="icon" href="img/duckieblue.png" type="image/png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #6495ED;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: Georgia, "Times New Roman", Times, serif;
}

.duckie {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 10px;
}

.duckie img {
    width: 150px;
    height: 150px;
    transition: transform 0.2s ease;
}

.duckie img:hover {
    transform: scale(1.05);
}

.container {
    flex: 1;
    display: flex;
    flex-direction: column;
}

#prompt {
    background-color: #6495ED;
    border: none;
    font-size: 24px;
    font-weight: bold;
    color: #323131;
    text-align: center;
    outline: none;
    width: 100%;
    padding: 16px;
    font-family: Georgia, "Times New Roman", Times, serif;
    resize: none;
    min-height: 60px;
    line-height: 1.4;
}

#prompt::placeholder {
    color: #323131;
    opacity: 0.5;
}

#response {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    color: whitesmoke;
    font-size: 28px;
    text-align: center;
    font-family: Georgia, "Times New Roman", Times, serif;
    line-height: 1.4;
    min-height: 120px;
    word-wrap: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
    max-width: 100%;
}

.byline {
    border-top: 2px solid rgba(255,255,255,0.2);
    display: flex;
    justify-content: space-between;
    color: whitesmoke;
    font-size: 14px;
    font-family: Arial, Helvetica, sans-serif;
    padding: 12px 16px;
}

.byline a {
    color: whitesmoke;
    text-decoration: none;
}

.byline a:hover {
    font-weight: bold;
}

@media (min-width: 768px) {
    .duckie img {
        width: 200px;
        height: 200px;
    }
    #response {
        font-size: 32px;
    }
}
</style>
</head>

<body>
  <div class="duckie">
      <a href="#" id="ducklink">
          <img src="img/pitr-Ducky-icon.svg"
          alt="duckie"/>
      </a>
  </div>
  <div class="container">
    <textarea id="prompt" placeholder="Write to Duckie... Click the Duckie..."></textarea>
    <div id="response"></div>
  </div>
  <div class="byline">
    <a href="https://medium.com/@chris_47577/duckie-says-write-down-your-experiences-8da5a07c41c3" target="_blank" rel="noopener">what the duck?</a>
    <a href="https://legacy.duckiesays.com" target="_blank" rel="noopener">legacy duck</a>
  </div>

<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript">
$(document).ready(function () {
    function submitPrompt() {
        var prompt = $("#prompt").val();
        if (prompt.trim() === "") {
            return;
        }
        var root = window.location.protocol + "//" + window.location.host;
        var target = root + "/api/v2/thinks";
        $("#response").text(". . .");
        $.ajax({
            type: "POST",
            url: target,
            data: JSON.stringify({ prompt: prompt }),
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            success: function (data) {
                setTimeout(function () {
                    $("#response").text(data.says);
                }, 1000);
            },
            error: function () {
                $("#response").text("The duck is pondering... or perhaps napping.");
            }
        });
    }

    $("#prompt").on("input", function () {
        this.style.height = "auto";
        this.style.height = (this.scrollHeight) + "px";
    });

    $("#prompt").keydown(function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            submitPrompt();
        }
    });

    $("#ducklink").click(function (e) {
        e.preventDefault();
        submitPrompt();
    });
});
</script>

</body>
</html>
