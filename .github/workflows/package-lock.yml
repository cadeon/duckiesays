# Automated package-lock audit
name: Package Lock Audit
on:
  schedule:
    - cron: '0 1 * * MON'
services:
  node-exporter:
    image: 'node:18'
jobs:
  audit-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Audit package-lock.json
        run: |
          npm install && \
          npm ci --package-lock-only && \
          npm ls > lock-summary.txt
        env:
          NPM_CONFIG_LOGLEVEL: notice
      - name: Check lock consistency
        run: |
          git diff --quiet || \
          (git add lock-summary.txt && git commit -m "Updated package-lock")
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
